name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc --version
          g++ --version
          uname -a

      - name: Show toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          g++ --version
          uname -a

      - name: Build shared library + tests (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          g++ -O2 -std=c++17 -mavx2 -mfma -fPIC -shared \
              -Iinclude -Isrc \
              src/lc.cpp -o build/liblc.so
          g++ -O2 -std=c++17 -mavx2 -mfma \
              -Iinclude -Isrc \
              tests/test_core.cpp -o build/test_core
          file build/liblc.so
          file build/test_core

      - name: Build shared library + tests (Windows MinGW)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build
          g++ -O2 -std=c++17 -mavx2 -mfma -shared \
              -Iinclude -Isrc \
              src/lc.cpp \
              -Wl,--out-implib=build/liblc.a \
              -o build/liblc.dll -ladvapi32 \
              -static-libgcc -static-libstdc++
          g++ -O2 -std=c++17 -mavx2 -mfma \
              -Iinclude -Isrc \
              tests/test_core.cpp -o build/test_core.exe \
              -static-libgcc -static-libstdc++

      - name: Build minimal example (Linux, links against liblc.so)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -std=c99 -Iinclude examples/pulse_1d.c \
              -Lbuild -llc -Wl,-rpath,'$ORIGIN/../build' \
              -o build/pulse_1d
          LD_LIBRARY_PATH=build ./build/pulse_1d || true

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        run: ./build/test_core

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./build/test_core.exe
