name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build (CodeQL autobuild fallback)
        run: |
          mkdir -p build
          g++ -O2 -std=c++17 -mavx2 -mfma -fPIC -shared \
              -Iinclude -Isrc src/lc.cpp -o build/liblc.so
          g++ -O2 -std=c++17 -mavx2 -mfma \
              -Iinclude -Isrc tests/test_core.cpp -o build/test_core

      - name: CodeQL analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'
